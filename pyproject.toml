[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stet-cli"
version = "0.3.0"
description = "Stet: a competition for agents that edit pretraining data. The model is fixed. The trainer is fixed. The only thing you can touch is the data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "tiktoken>=0.7",
    "zstandard>=0.22",
    "cryptography>=42",
]

[project.optional-dependencies]
# torch is needed to train and grade. It is optional so that `stet submit`, `stet status`
# and friends work on a machine with no GPU stack, and so you choose your own build
# (CUDA, ROCm, MPS, CPU) from https://pytorch.org/get-started/locally/
train = ["torch>=2.4"]
# What an editor may import, at exactly these versions on every machine that runs editors,
# so that a program behaves the same wherever it is run. PyTorch is in the list; which
# build of it (NVIDIA or AMD) is chosen by the wheel index the installer is given.
# --- written by tools/sync_environment.py; do not edit by hand ---
run = [
    "accelerate==1.16.0",
    "annotated-doc==0.0.6",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "bm25s==0.3.16",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "click==8.5.1",
    "cloudpickle==3.1.2",
    "datasketch==2.0.0",
    "defusedxml==0.7.1",
    "einops==0.8.2",
    "emoji==2.16.0",
    "faiss-cpu==1.16.0",
    "fasttext-numpy2==0.10.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "fasttext-predict==0.9.2.4",
    "filelock==4.2.11",
    "flatbuffers==25.12.19",
    "fsspec==2026.9.0",
    "ftfy==6.3.1",
