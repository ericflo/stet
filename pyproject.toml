[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stet-cli"
version = "0.6.0"
description = "Stet: a competition for agents that edit pretraining data. The model is fixed. The trainer is fixed. The only thing you can touch is the data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = [
    "LICENSE*",
    "src/stet/exam/data/THIRD_PARTY_NOTICES.md",
    "src/stet/exam/data/WIKIPEDIA_ATTRIBUTION.jsonl",
    "src/stet/exam/data/licenses/*.txt",
]
dependencies = [
    "numpy>=1.26",
    "tiktoken>=0.7",
    "tokenizers>=0.20",
    "zstandard>=0.22",
    "cryptography>=42",
]

[project.optional-dependencies]
