dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stet = "stet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stet"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Stated here so that every machine and CI check the same thing, whatever ruff's defaults become.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
