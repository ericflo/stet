# A small language model reads the candidates. A template for curators that use model
# weights: see curator.py. https://www.stetrun.com
name = "reader"
description = "tidy's candidates, read by a 135M-parameter language model: the most and least predictable are dropped. Shows how a curator names and loads model weights."
technique = "prose-line ranges + dedup + small-LM perplexity band"
entry = "python curator.py"
license = "MIT"
